name: CI

# roadmap.md e roadmap.html sono generati ma stanno nel repo, comodi da
# leggere senza rigenerarli. Questo job verifica che corrispondano ai CSV
# sorgente rigenerandoli e diffando il risultato — nessun bot scrive su
# nessun ramo: un push con GITHUB_TOKEN non fa ripartire la CI sul nuovo
# commit, quindi un job che li rigenerasse e committasse lascerebbe la PR
# con la HEAD priva del check "build", rendendola non mergeabile con i
# required status check attivi.
#
# roadmap.md è deterministico al 100%: si diffa senza normalizzazioni.
# roadmap.html invece porta anche la data di run nel campo "generated" del
# payload JSON incorporato — l'unica riga non deterministica del file — e
# quel campo va normalizzato prima del confronto, altrimenti il check
# fallirebbe ogni giorno anche senza modifiche reali ai CSV.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Dummy values so the Next.js build can complete — no real Supabase/Anthropic
          # calls happen at build time, but the client is constructed at module load
          # in a few places, so these need to be non-empty.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://www.meetonda.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 roadmap/sync_status.py 1
      - run: python3 roadmap/build_roadmap.py

      - name: Check roadmap.md is up to date
        run: |
          if ! git diff --exit-code roadmap/roadmap.md; then
            echo "::error::roadmap.md non corrisponde ai CSV sorgente. Esegui 'python3 roadmap/build_roadmap.py' e committa il risultato."
            exit 1
          fi

      - name: Check roadmap.html is up to date (date field normalized)
        run: |
          normalize_generated() {
            sed -E 's/"generated":"[0-9]{4}-[0-9]{2}-[0-9]{2}"/"generated":"NORMALIZED"/'
          }
          git show HEAD:roadmap/roadmap.html | normalize_generated > /tmp/roadmap.committed.html
          normalize_generated < roadmap/roadmap.html > /tmp/roadmap.regenerated.html
          if ! diff -u /tmp/roadmap.committed.html /tmp/roadmap.regenerated.html; then
            echo "::error::roadmap.html non corrisponde ai CSV sorgente (a parte il campo 'generated', ignorato di proposito). Esegui 'python3 roadmap/build_roadmap.py' e committa il risultato."
            exit 1
          fi
