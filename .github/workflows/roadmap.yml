name: Roadmap — regenerate tracker

# Rigenera roadmap.md e roadmap.html quando cambiano le fonti di verità.
# Entrambi sono testo deterministico, quindi si committano senza churn.
# Nessuna dipendenza da installare: il generatore usa solo la stdlib.
on:
  push:
    branches: [main]
    paths:
      - "roadmap/milestones.csv"
      - "roadmap/roadmap.csv"
      - "roadmap/ARCHIVE.csv"
      - "roadmap/findings.csv"
      - "roadmap/next.csv"
      - "roadmap/build_roadmap.py"
      - "roadmap/view_template.html"

permissions:
  contents: write

concurrency:
  group: roadmap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tracker schema
        run: python3 roadmap/sync_status.py 1

      - name: Regenerate roadmap.md + roadmap.html
        run: python3 roadmap/build_roadmap.py

      - name: Commit the generated views if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain roadmap/roadmap.md roadmap/roadmap.html)" ]; then
            git add roadmap/roadmap.md roadmap/roadmap.html
            git commit -m "chore(roadmap): regenerate views from the CSVs [skip ci]"
            git push
          else
            echo "roadmap.md and roadmap.html unchanged — nothing to commit."
          fi
