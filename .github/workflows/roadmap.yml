name: Roadmap — regenerate tracker

# Rigenera il markdown (e l'xlsx) quando cambia la fonte di verità roadmap.csv.
# Committa SOLO roadmap.md (testo deterministico → nessun churn). L'xlsx non è
# tracciato in git: viene rigenerato e caricato come artifact scaricabile.
on:
  push:
    branches: [main]
    paths:
      - "roadmap/roadmap.csv"
      - "roadmap/build_roadmap.py"

permissions:
  contents: write

concurrency:
  group: roadmap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install openpyxl

      - name: Regenerate roadmap (md + xlsx)
        run: python3 roadmap/build_roadmap.py

      - name: Commit roadmap.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain roadmap/roadmap.md)" ]; then
            git add roadmap/roadmap.md
            git commit -m "chore(roadmap): regenerate roadmap.md from roadmap.csv [skip ci]"
            git push
          else
            echo "roadmap.md unchanged — nothing to commit."
          fi

      - name: Upload Gantt xlsx as artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-gantt-xlsx
          path: roadmap/BOB_Roadmap_Gantt.xlsx
          if-no-files-found: warn
